<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MIDI Manager</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>MIDI Manager</h1>
      <nav>
        <button data-page="scan" class="active">扫描</button>
        <button data-page="library">文件库</button>
        <button data-page="dedup">去重中心</button>
        <button data-page="settings">设置统计</button>
      </nav>
    </header>

    <main>
      <!-- 扫描页 -->
      <section id="page-scan" class="page active">
        <div class="panel">
          <h2>扫描 MIDI 目录</h2>
          <div class="row">
            <input id="scanDirInput" type="text" placeholder="输入目录路径，如 D:\Music\midi" />
            <button id="browseBtn">浏览…</button>
            <button id="addDirBtn" class="primary">添加目录</button>
          </div>
          <div id="scanDirList" class="dir-list"></div>
          <div class="row">
            <label>自动删除重复：</label>
            <select id="autoDedupSelect">
              <option value="byte" selected>仅字节相同（推荐）</option>
              <option value="off">关闭（进候选组手动处理）</option>
            </select>
            <span class="hint">字节相同 = 文件完全一致，删除安全</span>
          </div>
          <div class="row">
            <button id="startScanBtn" class="primary big">开始扫描</button>
            <button id="stopScanBtn" class="danger" disabled>停止扫描</button>
            <button id="clearScanBtn">清空列表</button>
          </div>
          <div id="scanProgress" class="progress"></div>
          <div id="scanStatus" class="status"></div>
        </div>
      </section>

      <!-- 文件库页 -->
      <section id="page-library" class="page">
        <div class="panel">
          <h2>文件库查询（Exact：乐器集合恰好等于所选）</h2>
          <div class="filters">
            <div class="filter-col">
              <label>乐器过滤</label>
              <input id="instFilterInput" type="text" placeholder="输入关键词过滤乐器" />
              <div id="instList" class="check-list"></div>
              <label>匹配模式</label>
              <div class="row">
                <label><input type="radio" name="matchMode" value="exact" checked /> 精确（恰好等于所选）</label>
                <label><input type="radio" name="matchMode" value="superset" /> 包含所选（可含其他乐器）</label>
              </div>
            </div>
            <div class="filter-col">
              <label>文件名关键词</label>
              <input id="nameInput" type="text" />
              <label>目录前缀</label>
              <input id="dirInput" type="text" />
              <label>总音符区间（min-max）</label>
              <input id="totalRangeInput" type="text" placeholder="如 100-5000" />
              <label>每乐器音符区间（min-max）</label>
              <input id="noteRangeInput" type="text" placeholder="如 0-2000" />
              <button id="queryBtn" class="primary">查询</button>
            </div>
          </div>
        </div>
        <div class="panel">
          <h2 id="resultTitle">查询结果</h2>
          <div id="resultTableWrap" class="table-wrap"></div>
          <div class="row">
            <button id="prevPageBtn">上一页</button>
            <button id="nextPageBtn">下一页</button>
            <span id="pageInfo"></span>
          </div>
        </div>
      </section>

      <!-- 去重中心 -->
      <section id="page-dedup" class="page">
        <div class="panel">
          <h2>去重中心</h2>
          <div class="row">
            <button id="detectBtn" class="primary">重新检测重复</button>
            <button id="refreshDedupBtn">刷新候选组</button>
            <button id="resolveAllBtn" class="danger">全部去重（按默认规则）</button>
            <button id="stopResolveBtn" class="danger" disabled>停止处理</button>
            <button id="clearPendingBtn">清空候选</button>
            <span class="hint">全部去重为后台分批处理、可随时停止；清空候选只清状态、不删文件</span>
          </div>
          <div id="resolveProgress" class="progress"></div>
          <div id="dedupList"></div>
        </div>
      </section>

      <!-- 设置统计 -->
      <section id="page-settings" class="page">
        <div class="panel">
          <h2>设置 / 统计 <button id="refreshStatsBtn" class="small">刷新</button></h2>
          <div id="statsView"></div>
        </div>
      </section>
    </main>

    <footer id="statusbar"></footer>

    <!-- 删除确认弹窗 -->
    <div id="confirmModal" class="modal hidden">
      <div class="modal-box">
        <h3 id="confirmTitle">确认永久删除？</h3>
        <div id="confirmBody"></div>
        <div class="row">
          <button id="confirmYes" class="danger">确认删除</button>
          <button id="confirmNo">取消</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
